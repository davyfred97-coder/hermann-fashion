<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermann Fashion | Catalogue Haute Couture</title>
    
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Petit style rapide pour tester l'affichage si ton CSS n'est pas encore là */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f9f9f9; color: #333; }
        header { background: #000; color: #fff; padding: 2rem; text-align: center; text-transform: uppercase; letter-spacing: 2px; }
        .container { max-width: 1200px; margin: 20px auto; padding: 20px; text-align: center; }
        .catalogue-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: white; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px; }
        .card img { max-width: 100%; border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <h1>Hermann Fashion</h1>
        <p>L'élégance à l'état pur</p>
    </header>

    <div class="container">
        <h2>Notre Catalogue</h2>
        <p>Bienvenue sur votre espace mode. Les créations ajoutées via l'administration s'afficheront ici bientôt.</p>
        
        <div class="catalogue-grid" id="catalogue">
            <div class="card">
                <p>Chargement des dernières créations...</p>
            </div>
        </div>
    </div>

    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>

</body>
</html>
